spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auto_orchestrator
  username: postgres
  password: root
  driver-class-name: org.postgresql.Driver

server:
  port: 8081

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/